name: Re-tag the published index

# By hand only. Adds the level and years tags (sl, ss, yx, ys) to release index-latest in place, without changing which roles it
# holds (scripts/retag_release.py has the checks). Made on 27 Nov 2026, when the tags reached main while the nightly could not
# publish. Leave "upload" off for a dry run: it tags and checks, and keeps the report as an artifact.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the tagged shards and manifest (off: a dry run)"
        type: boolean
        default: false

permissions:
  contents: write           # upload the release assets

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Re-tag
        run: python -u scripts/retag_release.py work/retag ${{ inputs.upload && '--upload' || '' }}

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retag-report
          path: work/retag/report.json
          if-no-files-found: ignore

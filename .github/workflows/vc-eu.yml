name: VC-backed startups in Europe

# Re-reads the careers systems of the European VC-backed startups in data/startups_eu.json and republishes
# vc-eu.json.gz on release index-latest. The main shards are neither read nor written. Twice a day, away from the
# main build at 03:17 UTC. On Sunday afternoons (or on request) the company list is first refreshed from public sources
# (Y Combinator's directory, investors' own portfolio pages), every company we cannot read yet is looked at again, and
# the list is published on the release as startups-eu.json; later runs use the newest list. Every run measures coverage
# on a random sample of 200 companies and writes it into the file.

on:
  schedule:
    - cron: "41 1,13 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Refresh the company list from public sources first"
        type: boolean
        default: false

permissions:
  contents: write           # upload release assets

concurrency:
  group: vc-eu
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Use the newest company list (the weekly refresh publishes it as a release asset)
        run: |
          mkdir -p work
          if gh release download index-latest --pattern startups-eu.json --output work/startups-eu.release.json 2>/dev/null; then
            python scripts/startups_eu.py newest work/startups-eu.release.json
          fi
          if gh release download index-latest --pattern startups-world.json --output work/startups-world.release.json 2>/dev/null; then
            REGION=world python scripts/startups_eu.py newest work/startups-world.release.json
          fi

      - name: Refresh the company list from public sources (Sunday 13:41 run, or on request)
        if: ${{ inputs.refresh || github.event.schedule == '41 13 * * *' }}
        run: |
          if [ "${{ inputs.refresh }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            python -u scripts/yc_directory.py --gap 0.7 > work/yc.log 2>&1 &
            python -u scripts/vc_portfolios.py > work/portfolios.log 2>&1 &
            wait
            tail -3 work/yc.log work/portfolios.log
            python -u scripts/startups_eu.py refresh 45
            cp data/startups_eu.json work/startups-eu.json
            gh release upload index-latest work/startups-eu.json --clobber
            if [ -f data/startups_world.json ]; then
              REGION=world python -u scripts/startups_eu.py refresh 30
              cp data/startups_world.json work/startups-world.json
              gh release upload index-latest work/startups-world.json --clobber
            fi
          else
            echo "Not Sunday: the company list is unchanged."
          fi

      - name: Funding rounds from public news (EU-Startups feed each run; its archive on the weekly refresh)
        run: |
          if gh release download index-latest --pattern funding-eu.json --output work/funding-eu.release.json 2>/dev/null; then
            python scripts/funding_eu.py newest work/funding-eu.release.json
          fi
          if [ "${{ inputs.refresh }}" = "true" ] || { [ "${{ github.event.schedule }}" = "41 13 * * *" ] && [ "$(date -u +%u)" = "7" ]; }; then
            python -u scripts/funding_eu.py archive || true
          fi
          python -u scripts/funding_eu.py rss || true
          cp data/funding_eu.json work/funding-eu.json && gh release upload index-latest work/funding-eu.json --clobber || true

      - name: Use the latest company-homepage cache for the industry label (read only; the main run keeps it)
        run: gh release download index-latest --pattern homepages.json.gz --dir data/industry --clobber || echo "using the committed homepage cache"

      - name: Read every listed company's careers system and build vc-eu.json.gz
        run: python -u -m jobalfred_index vceu --minutes 60

      - name: Measure coverage on a random sample of 200 companies (written into each file)
        run: |
          python -u scripts/startups_eu.py coverage dist-vc/vc-eu.json.gz 200
          if [ -f dist-vc/vc-world.json.gz ]; then REGION=world python -u scripts/startups_eu.py coverage dist-vc/vc-world.json.gz 200; fi

      - name: Publish (refuses a file far smaller than the last one; a failed run keeps the last good file)
        run: |
          bash scripts/publish_vc_eu.sh dist-vc/vc-eu.json.gz
          if [ -f dist-vc/vc-world.json.gz ]; then bash scripts/publish_vc_eu.sh dist-vc/vc-world.json.gz; fi

      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc-eu-report
          path: |
            work/report-vceu-*.json
            work/coverage-*.json
          if-no-files-found: ignore
